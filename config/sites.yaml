# Sitios de vuelo disponibles. Público — solo define DÓNDE están los
# puntos de despegue/aterrizaje, no quién se suscribe ni qué condiciones
# quiere cada uno (eso vive en el secret SUBSCRIBERS_JSON, ver MANUAL.md
# sección "Suscriptores").
#
# Cada sitio define uno o dos puntos (launch obligatorio, landing opcional).
# elevation_m es la altura real del punto (usala vos, no confíes en el
# campo "elevation" que devuelve Open-Meteo — es la altura del grid del
# modelo, no la del terreno real).

sites:
  - id: gruenten
    name: "Grünten (Allgäu, DE)"
    timezone: "Europe/Berlin"
    points:
      launch:
        lat: 47.553
        lon: 10.317
        elevation_m: 1050
      landing:
        lat: 47.568   # TBD: refinar pin exacto del aterrizaje (zona Burgberg)
        lon: 10.335
        elevation_m: 780

  # Ejemplo de sitio plano (sin landing separado).
  # TBD: confirmar coordenadas reales del sitio antes de activarlo.
  - id: lujan
    name: "Luján (Buenos Aires, AR)"
    timezone: "America/Argentina/Buenos_Aires"
    points:
      launch:
        lat: -34.57
        lon: -59.05
        elevation_m: 30

  # TBD: pines placeholder, confirmar despegue/aterrizaje reales antes de activarlo.
  - id: bariloche
    name: "Bariloche (Río Negro, AR)"
    timezone: "America/Argentina/Salta"
    points:
      launch:
        lat: -41.15
        lon: -71.31
