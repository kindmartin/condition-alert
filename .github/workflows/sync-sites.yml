name: Sync sites

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (print what would be synced, don't write docs/sites.json)"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements-sync.txt

      - name: Sync sites from Google Sheet
        env:
          SITES_SHEET_CSV_URL: ${{ secrets.SITES_SHEET_CSV_URL }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python scripts/sync_sites.py --dry-run
          else
            python scripts/sync_sites.py
          fi

      - name: Persist sites.json
        if: ${{ inputs.dry_run != true }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs/sites.json
          if ! git diff --staged --quiet; then
            git commit -m "Update sites.json [skip ci]"
            git pull --rebase origin main
            git push
          fi
